# Publishes the core on every version tag, which is what both install routes point at:
#   curl  → releases/latest/download/routi-core.tar.gz  (scripts/install.sh)
#   brew  → the same tarball, pinned by sha256 in the tap's formula
name: Release
on:
  push:
    tags: ['v*']
jobs:
  core:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Pack the core
        env:
          ROUTI_GOOGLE_CLIENT_ID: ${{ secrets.ROUTI_GOOGLE_CLIENT_ID }}
          ROUTI_GOOGLE_CLIENT_SECRET: ${{ secrets.ROUTI_GOOGLE_CLIENT_SECRET }}
        run: |
          python3 scripts/pack-core.py routi-core.tar.gz
          shasum -a 256 routi-core.tar.gz | tee routi-core.tar.gz.sha256
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            routi-core.tar.gz
            routi-core.tar.gz.sha256
          generate_release_notes: true
