name: An idea
description: Something Routi should do, or do differently.
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you want to be able to do, and what you do today instead.
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App version
      placeholder: 0.1.31
