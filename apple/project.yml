name: Routi
options:
  bundleIdPrefix: com.narralabs
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.32"
    CURRENT_PROJECT_VERSION: "132"
    # Ad-hoc signing ("Sign to Run Locally"). Needs no Apple account and still
    # satisfies the sandbox entitlement, so a fresh clone builds and runs on this Mac
    # immediately.
    #
    # For iPhone/iPad: sign in under Xcode > Settings > Accounts, then run
    # ./bootstrap.sh --ios, which switches to automatic signing against your team and
    # adds iOS to the target's destinations. The app code is already universal — this
    # is purely a provisioning switch.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES
    # On even for ad-hoc builds: notarization requires it, and a build that only turns
    # it on when a Developer ID is present would find its runtime problems on the day
    # it ships rather than on any day before. scripts/package.sh supplies the identity.
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: minimal
  configs:
    # xcodegen does not define DEBUG on its own, so `#if DEBUG` silently compiled
    # out — which is exactly the kind of thing the build stamp exists to catch.
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      GCC_PREPROCESSOR_DEFINITIONS: "DEBUG=1 $(inherited)"

# Sparkle updates the Mac app in place: a background download, then "Restart to
# Update". The phone gets its updates from TestFlight and the App Store, so the
# dependency is filtered to macOS. The public key pairs with a private key kept in
# the release Mac's login keychain (generated once by Sparkle's generate_keys).
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.6

schemes:
  Routi:
    build:
      targets:
        Routi: all
        RoutiUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [RoutiUITests]
    archive:
      config: Release

targets:
  # Drives the app on an iPhone simulator with real taps, drags and holds, against a
  # running core, and reads back what input the desktop was sent. The one place the
  # phone's touch handling is proven rather than described.
  RoutiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RoutiUITests]
    dependencies:
      - target: Routi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.narralabs.routi.uitests
        TEST_TARGET_NAME: Routi
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

  Routi:
    # NavigationSplitView adapts the same views to Mac, iPad, and iPhone; the handful
    # of genuine differences sit behind `#if os(macOS)`. Adding iOS to
    # supportedDestinations is all that's needed once signing is set up.
    type: application
    supportedDestinations: [macOS]
    sources:
      - path: Routi
    dependencies:
      - package: Sparkle
        destinationFilters: [macOS]
    # Stamps each build with the time and commit it came from. Debug builds show it
    # in the sidebar, which settles "am I looking at the new one?" without guessing
    # from file timestamps.
    # Generated into Routi/Info.plist; the INFOPLIST_KEY_ settings below are merged in.
    info:
      path: Routi/Info.plist
      properties:
        # The app talks to the core over plain ws://. From a phone that is a Tailscale
        # address, encrypted underneath by WireGuard — which App Transport Security
        # cannot know, and it refuses cleartext to anything but loopback and .local.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Sparkle: where the Mac app looks for a newer release, and the key its
        # downloads must be signed with. The feed is the newest release's asset.
        SUFeedURL: https://github.com/narralabs/routi/releases/latest/download/appcast.xml
        SUPublicEDKey: QQ0Dug1X13Tm/BllMY7rTyWGPuav5MPCPsfzJ78uQSM=
        # The app is sandboxed, so the installer runs from Sparkle's XPC service.
        SUEnableInstallerLauncherService: true
    postBuildScripts:
      - name: Stamp build identity
        basedOnDependencyAnalysis: false
        # Named as an input so the build system orders this after the plist is
        # generated; without it a clean build ran the script first, found no plist,
        # and the sidebar read "build ? · ?".
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          PLIST="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          [ -f "$PLIST" ] || exit 0
          STAMP="$(date '+%H:%M:%S')"
          SHA="$(git -C "$SRCROOT/.." rev-parse --short HEAD 2>/dev/null || echo '-')"
          for KEY in RoutiBuildTime:"$STAMP" RoutiBuildCommit:"$SHA"; do
            NAME="${KEY%%:*}"; VALUE="${KEY#*:}"
            /usr/libexec/PlistBuddy -c "Add :$NAME string $VALUE" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Set :$NAME $VALUE" "$PLIST"
          done
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.narralabs.routi
        # "Routi Bot" is the product; `Routi` stays the target and scheme name.
        PRODUCT_NAME: Routi Bot
        INFOPLIST_KEY_CFBundleDisplayName: Routi Bot
        # The standard About box (app menu → About) reads this; so does Finder's Get Info.
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 Narra Labs, LLC
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ENTITLEMENTS: Routi/Routi.entitlements
        # The Mac entitlements are the sandbox's; iOS has no such keys, and a profile
        # for it will not carry them. iOS gets an entitlements file with nothing in it.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Routi/Routi-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Routi/Routi-iOS.entitlements
        "ENABLE_APP_SANDBOX[sdk=iphoneos*]": "NO"
        "ENABLE_APP_SANDBOX[sdk=iphonesimulator*]": "NO"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
